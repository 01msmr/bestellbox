services:
  bestellbot:
    build: .
    restart: unless-stopped
    environment:
      ADMINS: "uli"            # kommagetrennt; dürfen jede Runde verwalten
    ports:
      - "127.0.0.1:3000:3000"  # lokal; im Toolbox-Netz auf 0.0.0.0 oder Reverse-Proxy ändern
    volumes:
      - bestellbot-data:/data
volumes:
  bestellbot-data:
